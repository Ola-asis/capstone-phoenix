apiVersion: batch/v1
kind: Job
metadata:
  name: taskapp-migration
  namespace: taskapp
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: taskapp-migration
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z -v -w3 postgres 5432; do
                echo "Waiting for postgres on port 5432...";
                sleep 2;
              done;
              echo "PostgreSQL is reachable!";
      containers:
        - name: db-migration
          image: ghcr.io/ts-a-devops/taskapp-backend:5d6b8fc
          envFrom:
            - configMapRef:
                name: taskapp-config
            - secretRef:
                name: taskapp-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
