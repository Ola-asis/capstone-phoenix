---
- name: Check if k3s-agent is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_agent_binary

- name: Install and join k3s-agent
  shell: >
    curl -sfL https://get.k3s.io | K3S_URL="https://{{ hostvars['control_plane'].private_ip }}:6443" K3S_TOKEN="{{ hostvars['control_plane'].k3s_token }}" INSTALL_K3S_EXEC="agent --node-ip {{ private_ip }}" sh -
  when: not k3s_agent_binary.stat.exists

- name: Ensure k3s-agent service is running and enabled
  service:
    name: k3s-agent
    state: started
    enabled: yes
