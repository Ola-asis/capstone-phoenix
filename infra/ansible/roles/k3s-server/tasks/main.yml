---
- name: Check if k3s service is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_server_binary

- name: Install k3s server
  shell: >
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --tls-san {{ ansible_host }} --node-ip {{ private_ip }} --advertise-address {{ private_ip }}" sh -
  when: not k3s_server_binary.stat.exists

- name: Ensure k3s service is running and enabled
  service:
    name: k3s
    state: started
    enabled: yes

- name: Wait for node-token to become available
  wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 60

- name: Read k3s node token
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: node_token_raw

- name: Set k3s token fact for all hosts
  set_fact:
    k3s_token: "{{ node_token_raw.content | b64decode | trim }}"
  run_once: true

- name: Check if local kubeconfig already exists
  delegate_to: localhost
  become: false
  stat:
    path: "{{ playbook_dir }}/kubeconfig"
  register: local_kubeconfig

- name: Fetch kubeconfig to local machine
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/kubeconfig"
    flat: yes
  when: not local_kubeconfig.stat.exists

- name: Update server address in local kubeconfig to public IP
  delegate_to: localhost
  become: false
  replace:
    path: "{{ playbook_dir }}/kubeconfig"
    regexp: 'https://127.0.0.1:6443'
    replace: "https://{{ ansible_host }}:6443"
  when: not local_kubeconfig.stat.exists
